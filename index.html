	<style>
	:root { --nudo-cream:#FFF8E9; --nudo-ink:#29252B; --nudo-pink:#F5A8BD; --nudo-blue:#A6CDE3; --nudo-yellow:#F7D979; }

	.nudo-action { width:58px; height:58px; border:2px solid var(--nudo-ink); border-radius:19px; background:white; font-size:30px; cursor:pointer; display:grid; place-items:center; touch-action:manipulation; }

<body ontouchstart="">

	<div id="ar-container"></div>
	<div id="nudo-hd-layer" class="nudo-hd-layer" aria-label="Botones de realidad aumentada"></div>

	//chat

	<section id="nudo-panel" class="nudo-panel" role="dialog" aria-modal="false" aria-labelledby="nudo-title" aria-hidden="true">
  <button class="nudo-close" id="nudo-close" type="button" aria-label="Cerrar información">×</button>
  <div class="nudo-eyebrow">NÜDO · APRENDE LSC</div>
  <h2 id="nudo-title"></h2>
  <p id="nudo-description"></p>
</section>
<script>
  const nudoInfo = {
    corazon: {title:'¿Sabías que...?', description:'¡La lengua de señas no es universal! Cada país puede tener su propia lengua de señas, con vocabulario y gramática diferentes. En Colombia utilizamos la Lengua de Señas Colombiana (LSC).'},
    mano: {title:'¡Sigue aprendiendo!', description:'Toca el ícono de la mano para explorar otra palabra y conocer su seña. Próximamente podrás cambiar de palabra desde aquí.'},
    cara: {title:'Seña: Amor', description:'Categoría: Expresiones y sentimientos. Esta seña permite expresar amor y afecto. Observa atentamente la posición de las manos y el movimiento del personaje para practicarla.'}
  };
  const nudoPanel=document.getElementById('nudo-panel');
  function mostrarInfoNudo(tipo){
    const info=nudoInfo[tipo]; if(!info)return;
    document.getElementById('nudo-title').textContent=info.title;
    document.getElementById('nudo-description').textContent=info.description;
    nudoPanel.dataset.type=tipo;
    nudoPanel.classList.add('is-visible');
    nudoPanel.setAttribute('aria-hidden','false');
  }
  function cerrarInfoNudo(){nudoPanel.classList.remove('is-visible');nudoPanel.setAttribute('aria-hidden','true')}
  document.getElementById('nudo-close').addEventListener('click',cerrarInfoNudo);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarInfoNudo()});
  nudoPanel.addEventListener('pointerdown',e=>e.stopPropagation());
  nudoPanel.addEventListener('click',e=>e.stopPropagation());
  window.mostrarInfoNudo=mostrarInfoNudo; // útil para conectar objetos de Three.js después
</script>

//finchat

	<div class="log" id="log">asdasdsa</div>

	<div id="overlay">
		<img id="start-logo" src="assets/logo-nudo.png" alt="NÜDO">
		<button id="start-button" type="button" style="display: none">Hoy es día de aprender una seña</button>
		<div id="progress-container">
			<div id="progress-bar-track" class="is-indeterminate" role="progressbar" aria-label="Carga del programa" aria-valuemin="0" aria-valuemax="100">
				<div id="progress-bar-fill"></div>
			</div>
			<div id="progress-label" role="status" aria-live="polite">Estamos preparando la seña del día 0%</div>
		</div>
	</div>

	<script type="module">

		import * as THREE from './js/three.module.js';
		import { APP } from './js/app.js';
		import { MindARController } from './js/mindar/mindar_controller.js';

		window.THREE = THREE; // Used by APP Scripts.

		const log = document.getElementById('log');
		const overlay = document.getElementById('overlay');
		const startButton = document.getElementById('start-button');
		const arContainer = document.getElementById('ar-container');
		const progressContainer = document.getElementById('progress-container');
		const progressFill = document.getElementById('progress-bar-fill');
		const progressTrack = document.getElementById('progress-bar-track');
		const progressLabel = document.getElementById('progress-label');

		const debugMode = new URLSearchParams(location.search).get('debug') === '1';

		let player = null;
		let mindarController = null;
		let loaded = false;
		let starting = false;
		let loadPromise = null;
		//chat
		let projectData = null;

		function setProgress(percent, text) {
			progressFill.style.width = percent === 0 ? '' : `${percent}%`;
			progressTrack.classList.toggle('is-indeterminate', percent === 0);
			if (percent === 0) progressTrack.removeAttribute('aria-valuenow');
			else progressTrack.setAttribute('aria-valuenow', percent);
			progressLabel.textContent = `${text} ${percent}%`;
		}

		function showLoading() {
			startButton.style.display = 'none';
			startButton.disabled = true;
			progressContainer.style.display = 'flex';
		}

		function showStartButton(text = 'Hoy es día de aprender una seña') {
			progressContainer.style.display = 'none';
			startButton.textContent = text;
			startButton.disabled = false;
			startButton.style.display = '';
		}

		async function loadEverything() {

			if (loadPromise) return loadPromise;

			loadPromise = (async () => {

				setProgress(0, 'Estamos preparando la seña del día');

				// Descarga app.json con progreso real (0% - 25%)
				const text = await new Promise((resolve, reject) => {
					const loader = new THREE.FileLoader();
					loader.load(
						'app.json',
						(t) => resolve(t),
						(e) => {
							if (e.lengthComputable) {
								const p = Math.round((e.loaded / e.total) * 25);
								setProgress(p, 'Estamos preparando la seña del día');
							}
						},
						(err) => reject(new Error(err.statusText || 'No se pudo descargar el json'))
					);
				});

				//chat
				projectData = JSON.parse(text);

				player = new APP.Player({ alpha: true });
				await player.load(projectData);	
				//chat	
				player.setSize(window.innerWidth, window.innerHeight);
				player.play();
				setProgress(55, 'Estamos preparando la seña del día');

				document.body.appendChild(player.dom);

				window.addEventListener('resize', function () {
					player.setSize(window.innerWidth, window.innerHeight);
				});

				window.player = player;

				setProgress(85, 'Estamos preparando la seña del día');
				log.textContent = 'initializing...';

				await new Promise((resolve) => setTimeout(resolve, 10));

				setProgress(85, 'Estamos preparando la seña del día');
				loaded = true;

				console.log(window.player);

			})().catch((e) => {
				loaded = false;
				loadPromise = null; // permite reintentar al pulsar el botón
				throw e;
			});

			return loadPromise;
		}


		// BOTONES HD: los objetos de Three.js conservan su posición y sus scripts.
		// Se reutiliza directamente la textura PNG de cada objeto, sin redibujarla.
		function instalarBotonesHD(controller, player) {
			const layer = document.getElementById('nudo-hd-layer');
            if (!layer) throw new Error('Falta la capa nudo-hd-layer');
			const definitions = [
				{ name: 'Objeto 1', tipo: 'mano' },
				{ name: 'Objeto 2', tipo: 'corazon' },
				{ name: 'Objeto 3', tipo: 'cara' }
			];
			const content = player.imageTargets?.[0]?.arContent;
			if (!content) throw new Error('No se encontró ARContent para los botones HD');
			const buttons = definitions.map(({ name, tipo }) => {
				const mesh = content.getObjectByName(name);
				if (!mesh?.isMesh || !(Array.isArray(mesh.material) ? mesh.material[0]?.map : mesh.material?.map)) {
					throw new Error(`No se encontró ${name} o su textura PNG en el JSON`);
				}
				const texture = Array.isArray(mesh.material) ? mesh.material[0].map : mesh.material.map;
				const img = texture.image;
				let url = img?.currentSrc || img?.src;
                // Algunas versiones de Three.js convierten las texturas a ImageBitmap (sin .src).
                // Recuperamos la imagen original incrustada en el JSON sin alterar su diseño.
                if (!url && projectData) {
                    const mat = (projectData.scene?.materials || []).find(m => m.uuid === mesh.material.uuid);
                    const tex = (projectData.scene?.textures || []).find(t => t.uuid === mat?.map);
                    const embedded = (projectData.scene?.images || []).find(i => i.uuid === tex?.image);
                    url = embedded?.url;
                }
				if (!url) throw new Error(`No se pudo obtener la imagen de ${name}`);
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'nudo-hd-button';
				button.setAttribute('aria-label', tipo === 'cara' ? 'Seña: Amor' : tipo === 'mano' ? 'Sigue aprendiendo' : '¿Sabías que...?');
				const image = document.createElement('img');
				image.src = url;
				image.alt = '';
				button.appendChild(image);
				button.addEventListener('pointerdown', e => e.stopPropagation());
				button.addEventListener('click', e => {
					e.stopPropagation();
					window.mostrarInfoNudo(tipo);
				});
				layer.appendChild(button);
				// No se oculta el objeto 3D: debe seguir disponible como referencia.
				// Solo se evita dibujar sus píxeles en WebGL.
				const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
				for (const material of materials) {
					material.colorWrite = false;
					material.depthWrite = false;
				}
				return { mesh, button };
			});

			let targetVisible = false;
			const hide = () => buttons.forEach(({button}) => button.style.display = 'none');
			controller.addListener('found', it => {
				if (it.arContent === content) targetVisible = true;
			});
			controller.addListener('lost', it => {
				if (it.arContent === content) { targetVisible = false; hide(); cerrarInfoNudo(); }
			});

			const point = new THREE.Vector3();
			function proyectar(mesh, x, y, camera, rect) {
				point.set(x, y, 0).applyMatrix4(mesh.matrixWorld).project(camera);
				return {
					x: rect.left + (point.x + 1) * rect.width / 2,
					y: rect.top + (1 - point.y) * rect.height / 2,
					z: point.z
				};
			}
			controller.addListener('update', () => {
				if (!targetVisible || !controller.mindar) { hide(); return; }
				const { scene, camera, renderer } = controller.mindar;
				const rect = renderer.domElement.getBoundingClientRect();
				if (!rect.width || !rect.height) { hide(); return; }
				scene.updateMatrixWorld(true);
				camera.updateMatrixWorld(true);
				for (const { mesh, button } of buttons) {
					if (!controller.objIsActive(mesh)) { button.style.display = 'none'; continue; }
					// Cada botón es un plano de 1 × 1 en el JSON original.
					const left = proyectar(mesh, -0.5, 0, camera, rect);
					const right = proyectar(mesh, 0.5, 0, camera, rect);
					const top = proyectar(mesh, 0, 0.5, camera, rect);
					const bottom = proyectar(mesh, 0, -0.5, camera, rect);
					if ([left,right,top,bottom].some(p => !Number.isFinite(p.x) || !Number.isFinite(p.y) || p.z < -1 || p.z > 1)) {
						button.style.display = 'none'; continue;
					}
					const width = Math.hypot(right.x-left.x, right.y-left.y);
					const height = Math.hypot(bottom.x-top.x, bottom.y-top.y);
					const cx = (left.x+right.x+top.x+bottom.x)/4;
					const cy = (left.y+right.y+top.y+bottom.y)/4;
					const angle = Math.atan2(right.y-left.y, right.x-left.x);
					if (width < 1 || height < 1) { button.style.display = 'none'; continue; }
					button.style.width = `${width}px`;
					button.style.height = `${height}px`;
					button.style.transform = `translate(${cx-width/2}px,${cy-height/2}px) rotate(${angle}rad)`;
					button.style.display = 'block';
				}
			});
		}

		// Al darle al botón start se inicia la cámara (requiere gesto del usuario).
		startButton.addEventListener('click', async () => {

			if (starting) return;
			starting = true;
			showLoading();
			setProgress(loaded ? 90 : 0, 'Estamos preparando la seña del día');

			try {
				await loadEverything();
				if (!loaded) return;

				setProgress(90, 'Estamos preparando la seña del día');

				// La cámara se inicia aquí, dentro del gesto del usuario.
				mindarController = new MindARController(arContainer, player, debugMode);
				// Crear los botones y registrar sus eventos antes de iniciar MindAR, esto es de CHAT
				instalarBotonesHD(mindarController, player);
				window.mindarController = mindarController;

				// REPRODUCIR MÚSICA AL RECONOCER LA ESCENA_ACA COMIENZA CHAT DE AUDIO
				mindarController.addListener('found', () => {
					if (window.nudoAudio) {
						window.nudoAudio.play();
					}
				});

				// PAUSAR MÚSICA AL PERDER LA ESCENA
				mindarController.addListener('lost', () => {
					if (window.nudoAudio) {
						window.nudoAudio.pause();
					}
				});
				//ESTA ACA ES CHAT DE AUDIO

				await mindarController.start();
				setProgress(100, 'Estamos preparando la seña del día');

				// El player sigue funcionando (scripts/audio) pero su canvas ya no se usa.
				if (player?.dom) player.dom.style.display = 'none';

				overlay.classList.add('hidden');
				setTimeout(() => overlay.remove(), 400);
			} catch (e) {
				console.error('Error durante la carga:', e);
				showStartButton('Reintentar');
			} finally {
				starting = false;
			}
		});

		// Todo se carga automáticamente al abrir la página.
		showLoading();
		loadEverything().then(() => {
			if (!starting) showStartButton();
		}).catch((e) => {
			console.error('Error durante la carga automática:', e.message);
			if (!starting) showStartButton('Reintentar');
		});

	</script>
</body>
